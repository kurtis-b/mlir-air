name: Build and Test with AIE tools on Ryzen AI

on:
  push:
    branches:
      - main
  pull_request:
  merge_group:
  workflow_dispatch:

defaults:
  run:
    shell: bash

concurrency:
  # A PR number if a pull request and otherwise the commit hash. This cancels
  # queued and in-progress runs for the same PR (presubmit) or commit
  # (postsubmit).
  group: ci-build-test-ryzenai-${{ github.event.number || github.sha }}
  cancel-in-progress: true

env:
  DEBIAN_FRONTEND: noninteractive
  XILINXD_LICENSE_FILE: /opt/xilinx/Xilinx.lic
  VITIS: /opt/ryzen_ai-1.3.0.1/vitis_aie_essentials

jobs:
  build-repo:
    name: Build and Test with AIE tools on Ryzen AI

    runs-on: ${{ matrix.runner_type }}
    strategy:
      fail-fast: false
      matrix:
        runner_type: [ amd8845hs, amdhx370 ]

    steps:

      - uses: actions/checkout@v3
        with:
          submodules: "true"

      - name: Setup environment
        run: |
          python3.12 -m venv air-venv
          source air-venv/bin/activate
          pip cache purge
          pip install --upgrade pip
          pip install lit cmake joblib
          pip install --pre torch-mlir torchvision \
            --index-url https://download.pytorch.org/whl/nightly/cpu \
            -f https://github.com/llvm/torch-mlir-release/releases/expanded_assets/dev-wheels

      - name: Get mlir-aie
        id: clone-mlir-aie
        run: |
          utils/clone-mlir-aie.sh
          source air-venv/bin/activate
          pushd mlir-aie
          pip install -r python/requirements.txt
          pip install -r python/requirements_ml.txt
          # requirements_ml.txt pins torch==2.12.0+cpu, which downgrades the
          # nightly torch installed in Setup. Reinstall the matching stable
          # torchvision so torchvision::nms is registered against torch 2.12.
          pip install "torchvision==0.27.1+cpu" --index-url https://download.pytorch.org/whl/cpu
          pip install -r python/requirements_dev.txt

          VERSION=$(utils/clone-llvm.sh --get-wheel-version)
          pip -q download mlir==$VERSION \
            -f https://github.com/Xilinx/mlir-aie/releases/expanded_assets/mlir-distro
          unzip -q mlir-*.whl
          find mlir -exec touch -a -m -t 201108231405.14 {} \;

          popd

      - name: Install mlir-aie from wheel
        run: |
          source air-venv/bin/activate
          MLIR_AIE_VERSION=$(utils/clone-mlir-aie.sh --get-wheel-version)
          pip install mlir_aie==$MLIR_AIE_VERSION \
            -f https://github.com/Xilinx/mlir-aie/releases/expanded_assets/v1.4.0/

      - name: Get llvm-aie
        run: |
          source air-venv/bin/activate
          python3 -m pip install --upgrade --force-reinstall llvm-aie -f https://github.com/Xilinx/llvm-aie/releases/expanded_assets/nightly

      - name: Build and test mlir-air
        run: |
          source air-venv/bin/activate

          export PATH=$VITIS/bin:$VITIS/aietools/bin:$PATH
          source /opt/xilinx/xrt/setup.sh

          WHL_MLIR_DIR=$(pwd)/mlir-aie/mlir
          MLIR_AIE_INSTALL_DIR="$(python3 -m pip show mlir_aie | grep ^Location: | awk '{print $2}')/mlir_aie"
          PEANO_INSTALL_DIR=$(python3 -m pip show llvm-aie | grep ^Location: | awk '{print $2}')/llvm-aie
          CMAKEMODULES_DIR=$(pwd)/mlir-aie/cmake/modulesXilinx

          mkdir -p build_assert
          pushd build_assert

          sudo prlimit -lunlimited --pid $$

          cmake .. \
            -GNinja \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DLLVM_ENABLE_ASSERTIONS=ON \
            -DPython3_EXECUTABLE=$(which python) \
            -DCMAKE_INSTALL_PREFIX=$PWD/../install \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_C_COMPILER=clang \
            -DCMAKE_CXX_COMPILER=clang++ \
            -DCMAKE_ASM_COMPILER=clang \
            -DCMAKE_EXE_LINKER_FLAGS_INIT="-fuse-ld=lld" \
            -DCMAKE_MODULE_LINKER_FLAGS_INIT="-fuse-ld=lld" \
            -DCMAKE_SHARED_LINKER_FLAGS_INIT="-fuse-ld=lld" \
            -DCMAKE_MODULE_PATH=${CMAKEMODULES_DIR}/ \
            -DLLVM_EXTERNAL_LIT=$(which lit) \
            -DLLVM_DIR=${WHL_MLIR_DIR}/lib/cmake/llvm \
            -DMLIR_DIR=${WHL_MLIR_DIR}/lib/cmake/mlir \
            -DAIE_DIR=${MLIR_AIE_INSTALL_DIR}/lib/cmake/aie \
            -Dx86_64_TOOLCHAIN_FILE=$PWD/../cmake/modules/toolchain_x86_64.cmake \
            -DAIR_RUNTIME_TARGETS:STRING="x86_64" \
            -DXRT_ROOT=/opt/xilinx/xrt \
            -DENABLE_RUN_XRT_TESTS=ON \
            -DPEANO_INSTALL_DIR=${PEANO_INSTALL_DIR}
          ninja install

          pip install $PWD/../python/spensor

          export LIT_OPTS="-sv --time-tests --show-unsupported --show-excluded --order random --timeout 600 -j8"
          ninja check-air-cpp
          ninja check-air-mlir
          ninja check-air-python

          # E2E test set 1: peano tests (retry once on failure for flaky NPU tests)
          ninja check-air-e2e-peano || ninja check-air-e2e-peano

          # Chess tests disabled to reduce CI time. Uncomment to re-enable:
          # ninja check-air-e2e-chess

          # Install LLM Python dependencies (safetensors, transformers, torch,
          # huggingface_hub). Required by all LLM compile and verify targets.
          pip install -r ../programming_examples/llms/llama32_1b/requirements.txt

          # Programming examples: non-LLM peano tests.
          # LLM tests are excluded here (--filter-out "llms/") and handled by
          # the dedicated targets below, which run sequentially (-j1) to avoid
          # concurrent NPU inference causing out-of-memory crashes.
          ninja check-programming-examples-peano || ninja check-programming-examples-peano

          # Transformer-layer execution-study PR gate: the 10 tests that
          # dispatch nothing (Peano objects plus a symbol check, and nine
          # host-only checks). The full 32-test suite is NOT run here -- 22 of
          # those REQUIRE ryzen_ai_npu2, and on a runner without one they all
          # report UNSUPPORTED while lit still exits 0.
          #
          # THE COUNT IS ASSERTED, and that is the whole point of the step. A
          # lit suite that selects nothing, or that reports every test
          # unsupported, exits 0 -- so "the gate was green" is not evidence
          # that it ran. This is lib-guard.sh's pl_assert_gate_ran_hardware
          # invariant verbatim: Passed must reach the expected count, and
          # Passed + Excluded must be the only nonzero categories.
          #
          # DO NOT assert "Total Discovered Tests: 10". Measured: it is 362.
          # add_lit_testsuite runs lit over the WHOLE programming_examples tree
          # and narrows with --filter, and lit counts every discovered test in
          # that line, recording the filtered-out ones as Excluded. Asserting it
          # fails on a green run -- which is why lib-guard.sh's rule names
          # Excluded explicitly, and why "Passed: N with nothing else nonzero"
          # is the assertion that actually means "N tests ran and all passed".
          ninja check-programming-examples-transformer-layer-host 2>&1 | tee tl-host.log

          # Every summary category line, as Label=count. lit prints a category
          # only when its count is nonzero and pads the labels, hence the
          # tolerant pattern.
          cats=$(sed -nE 's/^  ([A-Za-z][A-Za-z ]*[A-Za-z]) *: *([0-9]+).*/\1=\2/p' tl-host.log)
          if ! printf '%s\n' "$cats" | grep -qx "Passed=13"; then
            echo "::error::transformer-layer PR gate did not run all 13 tests"
            echo "  categories reported: ${cats:-(no summary at all)}"
            exit 1
          fi
          unexpected=$(printf '%s\n' "$cats" | grep -vE '^(Passed|Excluded)=' || true)
          if [ -n "$unexpected" ]; then
            echo "::error::transformer-layer PR gate: Passed and Excluded must be the only categories"
            echo "  also reported: $unexpected"
            exit 1
          fi
          rm -f tl-host.log

          # LLM compile/verify are intentionally NOT run here. They are covered
          # end to end (compile + verify + perf, all models) by the dedicated
          # nightly benchmark (nightlyPerfBenchmark.yml) on the Krackan runner,
          # which serves weights from a warm offline HF cache. Running them in
          # the per-PR matrix duplicated that work, was slow (int4's compile
          # alone exceeds the 600s per-test timeout), and needed HF secrets.

          # Chess tests disabled to reduce CI time. Uncomment to re-enable:
          # ninja check-programming-examples-chess

          # AIR-Runner test set
          ninja check-air-runner

          popd
          rm -rf build_assert
