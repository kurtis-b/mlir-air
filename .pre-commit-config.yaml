exclude: >-
  (?x)^(
    sandbox(?:\.bak\.[^/]+)?/|
    build[^/]*/|
    install[^/]*/|
    my_install/|
    llvm/|
    mlir-aie/|
    artifacts?/|
    logs?/|
    .*\.log$
  )|(^|/)__pycache__/|^\.git/

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v3.2.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
  - repo: https://github.com/psf/black
    rev: 23.3.0
    hooks:
      - id: black
